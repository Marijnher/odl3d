name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-and-native:
    name: T0 and T1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfreetype6 libglfw3 xvfb fonts-dejavu-core

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install glfw3:x64-windows freetype:x64-windows
          "$env:RUNNER_TEMP/vcpkg/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install freetype glfw

      - name: Configure macOS native library search path
        if: runner.os == 'macOS'
        run: echo "DYLD_LIBRARY_PATH=$(brew --prefix glfw)/lib:$(brew --prefix freetype)/lib" >> "$GITHUB_ENV"

      - name: Run T0 and T1 on Windows
        if: runner.os == 'Windows'
        run: dotnet test odl3d.sln --settings tests/coverage.runsettings --collect:"XPlat Code Coverage"

      - name: Run T0 and T1 on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet test odl3d.sln --settings tests/coverage.runsettings --collect:"XPlat Code Coverage"

      - name: Run T0 and T1 on macOS
        if: runner.os == 'macOS'
        run: dotnet test odl3d.sln --settings tests/coverage.runsettings --collect:"XPlat Code Coverage"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  merge-coverage:
    name: Merge cross-platform coverage
    if: always()
    needs: cpu-and-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Merge Cobertura reports
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator "-reports:coverage/**/coverage.cobertura.xml" "-targetdir:coverage/merged" "-reporttypes:Cobertura;Html;TextSummary"

      - uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage/merged
          if-no-files-found: error
