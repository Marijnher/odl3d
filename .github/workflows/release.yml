name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  library:
    name: Publish library
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag points at a commit on main
        shell: bash
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} does not point at a commit on main" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish library
        run: dotnet publish odl3d.csproj -c Release -o publish/odl3d

      - name: Archive publish output
        run: tar -czf "odl3d-${{ github.ref_name }}.tar.gz" -C publish/odl3d .

      - uses: actions/upload-artifact@v4
        with:
          name: odl3d-${{ github.ref_name }}
          path: odl3d-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  demo:
    name: Publish demo (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-14
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag points at a commit on main
        shell: bash
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} does not point at a commit on main" >&2
            exit 1
          fi

      - name: Install Linux native dependencies
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfreetype6 libglfw3

      - name: Install Windows native dependencies
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install glfw3:x64-windows freetype:x64-windows

      - name: Install macOS native dependencies
        # GitHub's macOS runners are arm64; Homebrew here only yields arm64 libs, so osx-x64 ships without bundled natives.
        if: matrix.rid == 'osx-arm64'
        run: brew install freetype glfw

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish demo/odl3d.Demo.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=false
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Bundle native libraries (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/${{ matrix.rid }}/bin" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/vcpkg/installed/x64-windows/bin/glfw3.dll" "publish/${{ matrix.rid }}/bin/"
          Copy-Item "$env:RUNNER_TEMP/vcpkg/installed/x64-windows/bin/freetype.dll" "publish/${{ matrix.rid }}/bin/"

      - name: Bundle native libraries (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir -p "publish/${{ matrix.rid }}/bin"
          cp "$(dpkg -L libglfw3 | grep 'libglfw\.so\.3$')" "publish/${{ matrix.rid }}/bin/libglfw.so.3"
          cp "$(dpkg -L libfreetype6 | grep 'libfreetype\.so\.6$')" "publish/${{ matrix.rid }}/bin/libfreetype.so.6"

      - name: Bundle native libraries (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        run: |
          mkdir -p "publish/${{ matrix.rid }}/bin"
          cp "$(brew --prefix glfw)/lib/libglfw.3.dylib" "publish/${{ matrix.rid }}/bin/"
          cp "$(brew --prefix freetype)/lib/libfreetype.6.dylib" "publish/${{ matrix.rid }}/bin/"

      - name: Archive publish output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "odl3d-demo-${{ matrix.rid }}.zip"

      - name: Archive publish output (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf "odl3d-demo-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: odl3d-demo-${{ matrix.rid }}
          path: odl3d-demo-${{ matrix.rid }}.*
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: [library, demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: odl3d-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
