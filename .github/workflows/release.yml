name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Publish library
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag points at a commit on main
        shell: bash
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} does not point at a commit on main" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish library
        run: dotnet publish odl3d.csproj -c Release -o publish/odl3d

      - name: Archive publish output
        run: tar -czf "odl3d-${{ github.ref_name }}.tar.gz" -C publish/odl3d .

      - uses: actions/upload-artifact@v4
        with:
          name: odl3d-${{ github.ref_name }}
          path: odl3d-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: odl3d-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
